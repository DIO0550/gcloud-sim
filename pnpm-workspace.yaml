# --- workspace に含めるパッケージ ---
#
# アプリは apps/ 配下、アプリ間で共有するものは packages/ 配下に置く。
# 「アプリから切り離せるもの」ができたら packages/ へ出していく。
packages:
  - 'apps/*'
  - 'packages/*'

# --- サプライチェーン対策: 公開直後のバージョンを取り込まない（クールタイム） ---
#
# npm のサプライチェーン攻撃は、乗っ取ったアカウントから新バージョンを publish する
# 形が多く、発覚と unpublish は数時間〜数日で起きる。その窓を跨いでから取り込む。
# 単位は分。7 日 = 10080 分。
minimumReleaseAge: 10080

# 期限を満たすバージョンが要求範囲に無いとき、古いバージョンへ黙って落とさずに
# 解決を失敗させる。明示設定した場合の既定値も true だが、既定が「明示したかどうか」で
# 変わる設定なので、意図として書き出しておく。
minimumReleaseAgeStrict: true

# 公開日（packument の time）を返さないレジストリのパッケージを、検査なしで通さない。
# 既定のレジストリ（registry.npmjs.org）は time を返すので、欠けているのはミラーや
# プライベートレジストリを経由した異常な経路を意味する。
minimumReleaseAgeIgnoreMissingTime: false

# クールタイムを待たずに入れるものだけをここに挙げる。
# 書ける形式: パッケージ名 / パターン（'@myorg/*'） / バージョン指定（'next@16.3.5'）。
# minimumReleaseAgeExclude:
#   - 'next@16.3.5'

# --- インストール時のビルドスクリプト ---
#
# 既定ではどの依存の postinstall も動かさない。ここに明示したものだけを判断する。
# esbuild（Storybook が使う）は postinstall がバイナリの確認だけで、プラットフォーム別の
# バイナリは optionalDependencies から入るので、動かさなくても使える。
allowBuilds:
  esbuild: false
